<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Auto Refresh</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="../icons/icon-32.png" alt="Logo" class="brand-icon">
        <span class="brand-title">Smart Auto Refresh</span>
      </div>
      <a href="#" id="btn-open-options" class="header-link" title="Open Rule Manager & Options">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </a>
    </header>

    <!-- Target URL Card -->
    <div class="url-card">
      <div class="url-label">Current Tab:</div>
      <div class="url-text" id="tab-url" title="">Detecting...</div>
      <div id="rule-status-badge" class="rule-badge hidden">Configured Rule Active</div>
    </div>

    <!-- Internal Page Disabled Notice -->
    <div id="disabled-notice" class="disabled-notice hidden">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="disabled-icon">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
      </svg>
      <div class="disabled-info">
        <span class="disabled-title">Auto Refresh Disabled</span>
        <span class="disabled-desc">Extensions cannot refresh internal browser pages (about:*)</span>
      </div>
    </div>

    <!-- Live Timer Hero Display -->
    <div class="hero-timer">
      <div class="status-indicator">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Stopped</span>
      </div>
      <div class="countdown-display" id="countdown-display">--:--</div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
    </div>

    <!-- Interval Selection -->
    <div class="section">
      <label class="section-label">Refresh Interval</label>
      <div class="preset-grid">
        <button type="button" class="preset-btn" data-sec="5">5s</button>
        <button type="button" class="preset-btn" data-sec="15">15s</button>
        <button type="button" class="preset-btn" data-sec="30">30s</button>
        <button type="button" class="preset-btn" data-sec="60">1m</button>
        <button type="button" class="preset-btn" data-sec="300">5m</button>
        <button type="button" class="preset-btn" data-sec="600">10m</button>
      </div>

      <div class="custom-interval-row">
        <input type="number" id="custom-interval-val" min="1" max="9999" value="15" class="input-number">
        <select id="custom-interval-unit" class="select-unit">
          <option value="1">Seconds</option>
          <option value="60">Minutes</option>
          <option value="3600">Hours</option>
        </select>
      </div>
    </div>

    <!-- Configuration Options -->
    <div class="section options-section">
      <!-- Pause on active tab -->
      <label class="toggle-row" title="If enabled, countdown pauses while you are actively viewing this tab and resumes when you switch away">
        <span class="toggle-info">
          <span class="toggle-title">Stop when tab is active</span>
          <span class="toggle-desc">Pauses countdown while viewing tab</span>
        </span>
        <input type="checkbox" id="chk-pause-active" class="toggle-input" checked>
        <span class="toggle-slider"></span>
      </label>

      <!-- Bypass cache -->
      <label class="toggle-row" title="Performs a hard reload without using browser cached files">
        <span class="toggle-info">
          <span class="toggle-title">Bypass cache</span>
          <span class="toggle-desc">Hard reload website content</span>
        </span>
        <input type="checkbox" id="chk-bypass-cache" class="toggle-input">
        <span class="toggle-slider"></span>
      </label>

      <!-- URL Matching Scope -->
      <div class="scope-group">
        <span class="scope-label">Rule Matching Scope:</span>
        <div class="scope-radios">
          <label class="scope-radio-label" title="Match this exact page URL only">
            <input type="radio" name="match-scope" value="exact" checked>
            <span>Exact</span>
          </label>
          <label class="scope-radio-label" title="Match all pages on this domain (*.domain.com)">
            <input type="radio" name="match-scope" value="domain">
            <span>Domain</span>
          </label>
          <label class="scope-radio-label" title="Match URLs starting with a prefix">
            <input type="radio" name="match-scope" value="prefix">
            <span>Prefix</span>
          </label>
          <label class="scope-radio-label" title="Match with * (any chars) and ? (single char)">
            <input type="radio" name="match-scope" value="wildcard">
            <span>Wildcard</span>
          </label>
          <label class="scope-radio-label" title="Match using JavaScript Regular Expression">
            <input type="radio" name="match-scope" value="regex">
            <span>RegExp</span>
          </label>
        </div>

        <!-- Pattern Custom Input Field (shown for prefix, wildcard, regex) -->
        <div id="custom-pattern-row" class="custom-pattern-row hidden">
          <label for="custom-pattern-input" class="custom-pattern-label">Pattern Expression:</label>
          <input type="text" id="custom-pattern-input" class="custom-pattern-input" placeholder="Pattern...">
          <div id="pattern-validation-error" class="validation-error hidden">Invalid Regular Expression</div>
        </div>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="action-footer">
      <button type="button" id="btn-toggle-timer" class="btn-primary btn-start">
        <span id="btn-toggle-icon">▶</span>
        <span id="btn-toggle-text">Start Auto Refresh</span>
      </button>
      <button type="button" id="btn-refresh-now" class="btn-secondary" title="Reload tab immediately">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
